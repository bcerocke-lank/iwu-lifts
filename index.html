<style>
/* Layout: single-column phone app, sticky header, content cards, fixed bottom tab bar */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --ink:#14211a; --muted:#5b6b62; --line:#d8e1da;
  --accent:#1d6a44; --accent-ink:#ffffff; --accent-soft:#e2efe6;
  --gold:#a8790a; --good:#1d7a45; --bad:#b3362c; --chip:#edf1ee;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0c1410; --surface:#141f19; --ink:#e6eee8; --muted:#93a59a; --line:#24342b;
  --accent:#52c086; --accent-ink:#06130c; --accent-soft:#183326;
  --gold:#e0b341; --good:#52c086; --bad:#f07a6f; --chip:#1b2a22; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:12px 24px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
.top-inner{max-width:640px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.phase-tag{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
h2{font-family:var(--display);font-weight:700;font-size:1.6rem;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.05;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0;letter-spacing:.02em;text-transform:uppercase}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
label{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;letter-spacing:.02em}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--bad)}
button.link{border:0;background:none;padding:4px 0;color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
a{color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.namegrid{display:grid;grid-template-columns:1fr 6rem;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.chip.ok{background:var(--accent-soft);color:var(--good)}
.chip.live{background:var(--accent);color:var(--accent-ink)}
.num{font-variant-numeric:tabular-nums}
.big-num{font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1}
.msg{font-size:.9rem;font-weight:600;min-height:1.2em}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--muted);padding:9px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;gap:4px;width:100%;max-width:640px}
nav.tabs button{flex:1;border:0;background:transparent;padding:8px 2px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="true"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* exercise cards */
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ex:first-of-type{border-top:0;padding-top:0}
.ex-name{font-weight:700;font-size:1.02rem}
.rx{display:flex;flex-wrap:wrap;gap:6px}
.sets{display:grid;grid-template-columns:2.2rem 1fr 1fr;gap:6px 8px;align-items:center}
.sets .h{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sets .n{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--muted);text-align:center}
.sets input{padding:8px 10px}
.last{font-size:.82rem;color:var(--muted)}
.savebar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 20px rgb(0 0 0 / .08)}
/* leaderboard */
.lb-row{display:grid;grid-template-columns:2.2rem 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lb-row:first-child{border-top:0}
.rank{font-family:var(--display);font-weight:700;font-size:1.4rem;text-align:center;color:var(--muted)}
.lb-row.r1 .rank{color:var(--gold)}
.lb-row.r2 .rank,.lb-row.r3 .rank{color:var(--ink)}
.lb-row.me{background:var(--accent-soft);margin:0 -10px;padding-inline:10px;border-radius:8px}
.lb-name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.lb-vol{font-family:var(--display);font-weight:700;font-size:1.3rem;text-align:right}
.lb-vol small{font-family:var(--body);font-size:.72rem;font-weight:600;color:var(--muted);margin-left:2px}
/* coach */
.code{font-family:var(--display);font-weight:700;font-size:clamp(4.5rem,24vw,9rem);letter-spacing:.12em;text-align:center;line-height:1;color:var(--accent)}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.qr{display:flex;justify-content:center;padding:12px;background:#ffffff;border-radius:10px;align-self:center}
.qr img,.qr canvas{display:block;max-width:100%;height:auto}
.codein{font-family:var(--display);font-weight:700;font-size:2.4rem;letter-spacing:.3em;text-align:center;padding:10px}
.att-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.att-row:first-child{border-top:0}
.empty{text-align:center;padding:18px 8px;color:var(--muted);font-size:.95rem}
.pr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr span:first-child{min-width:0;overflow-wrap:anywhere}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.wk{border-collapse:collapse;width:100%;font-size:.9rem}
table.wk th,table.wk td{padding:6px 4px;border-top:1px solid var(--line);text-align:center}
table.wk th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
table.wk td:first-child,table.wk th:first-child{text-align:left;white-space:nowrap}
table.wk .y{color:var(--good);font-weight:700}
table.wk .tot{font-weight:700}
@media (min-width:900px){ body.coach .wrap{max-width:1000px} body.coach .coach-cols{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start} }
.coach-cols{display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>

// ===== Helpers =====
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n=>String(n).padStart(2,"0");
const iso = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s=>{const [y,m,d]=String(s).slice(0,10).split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const shortDate = d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
const timeOf = t=>new Date(t).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
const fmt = n=>Math.round(Number(n)||0).toLocaleString();
const pick=(v,w)=>Array.isArray(v)?v[Math.min(w,v.length-1)]:v;
const numOr0=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
function setCount(s){const m=String(s).match(/\d+/g);return m?Math.max(...m.map(Number)):1}
function repsFor(r,sets){
  const s=String(r);
  if(/sec|yd|breath|failure|amap|max/i.test(s)) return Array(sets).fill("");
  const parts=s.split(",").map(x=>x.trim());
  if(parts.length===sets) return parts.map(p=>(p.match(/\d+/)||[""])[0]);
  const m=s.match(/\d+/); return Array(sets).fill(m?m[0]:"");
}
function locate(date){
  const t=parseISO(iso(date));
  for(const p of PROGRAM) for(let w=0;w<p.weeks.length;w++){
    const s=parseISO(p.weeks[w]); if(t>=s && t<addDays(s,7)) return {p:p.id,w};
  }
  let best={p:PROGRAM[0].id,w:0};
  for(const p of PROGRAM) for(let w=0;w<p.weeks.length;w++) if(parseISO(p.weeks[w])<=t) best={p:p.id,w};
  return best;
}
const phaseById=id=>PROGRAM.find(p=>p.id===id)||PROGRAM[0];
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
             del(k){try{localStorage.removeItem(k)}catch(e){}}};
function setMsg(id,text,kind){const el=$(id);if(!el)return;el.className="msg"+(kind?" "+kind:"");el.textContent=text||""}

async function rpc(fn,args={}){
  const headers={"Content-Type":"application/json","apikey":SUPABASE_KEY};
  if(SUPABASE_KEY.startsWith("eyJ")) headers.Authorization="Bearer "+SUPABASE_KEY;
  let r;
  try{ r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers,body:JSON.stringify(args)}); }
  catch(e){ throw new Error("Can't reach the server. Check your connection and try again."); }
  if(!r.ok){ let m=""; try{m=(await r.json()).message}catch(e){} throw new Error(m||`Server error (${r.status}). Try again.`); }
  const t=await r.text(); return t?JSON.parse(t):null;
}

// ----- Lift logging -----
const entryKey=(p,w,d,i)=>`${p}.${w}.${d}.${i}`;
const entryMap=()=>Object.fromEntries((S.data.entries||[]).map(e=>[e.key,e]));
function lastFor(name,exclude){
  let best=null;
  for(const e of S.data.entries||[]){ if(e.key===exclude||e.exercise!==name)continue; if(!best||e.at>best.at)best=e; }
  return best;
}
function renderLift(){
  const {p,w,d}=S.sel; const ph=phaseById(p); const day=ph.days[d]||ph.days[0];
  const key=`${p}.${w}.${d}`; const em=entryMap();
  if(S.liftKey!==key){
    S.draft={};
    day.ex.forEach((ex,i)=>{
      const sets=setCount(pick(ex[1],w)); const f=em[entryKey(p,w,d,i)];
      const reps=repsFor(pick(ex[2],w),sets);
      S.draft[i]=Array.from({length:sets},(_,j)=>({w:f?.sets?.[j]?.[0]??"",r:f?.sets?.[j]?.[1]??reps[j]}));
    });
    S.liftKey=key;
  }
  const opts=(arr,val)=>arr.map(([v,l])=>`<option value="${v}"${String(v)===String(val)?" selected":""}>${esc(l)}</option>`).join("");
  const wkStart=parseISO(ph.weeks[w]);
  const exHtml=day.ex.map((ex,i)=>{
    const [name,,,tempo,wt]=ex; const sets=pick(ex[1],w), reps=pick(ex[2],w);
    const last=lastFor(name,entryKey(p,w,d,i));
    const lastSets=last?(last.sets||[]).filter(s=>s[0]!==""):[];
    const lastTxt=lastSets.length?`Last time (${shortDate(new Date(last.at))}): ${lastSets.map(s=>`${s[0]}×${s[1]||"–"}`).join(", ")}`:"";
    return `<div class="ex"><div class="ex-name">${esc(name)}</div>
      <div class="rx"><span class="chip">${esc(sets)} × ${esc(reps)}</span>${tempo?`<span class="chip">${esc(tempo)}</span>`:""}${wt?`<span class="chip">${esc(wt)}</span>`:""}</div>
      ${lastTxt?`<div class="last">${esc(lastTxt)}</div>`:""}
      <div class="sets"><span class="h">Set</span><span class="h">Weight (lb)</span><span class="h">Reps</span>
      ${S.draft[i].map((s,j)=>`<span class="n">${j+1}</span>
        <input id="w-${i}-${j}" data-i="${i}" data-j="${j}" data-f="w" inputmode="decimal" placeholder="lb" value="${esc(s.w)}" aria-label="${esc(name)} set ${j+1} weight">
        <input id="r-${i}-${j}" data-i="${i}" data-j="${j}" data-f="r" inputmode="numeric" placeholder="reps" value="${esc(s.r)}" aria-label="${esc(name)} set ${j+1} reps">`).join("")}
      </div></div>`;
  }).join("");
  $("#app").innerHTML=`<div class="card">
      <div class="grid2">
        <label for="selP">Phase<select id="selP">${opts(PROGRAM.map(x=>[x.id,x.name]),p)}</select></label>
        <label for="selW">Week<select id="selW">${opts(ph.weeks.map((x,i)=>[i,`Week ${i+1} · ${shortDate(parseISO(x))}`]),w)}</select></label>
      </div>
      <label for="selD">Day<select id="selD">${opts(ph.days.map((x,i)=>[i,x.name]),d)}</select></label>
      ${ph.note?`<p class="small muted">${esc(ph.note)}</p>`:""}
    </div>
    <div class="card">
      <div class="row between"><h2>${esc(day.name)}</h2><span class="small muted">Week of ${shortDate(wkStart)}</span></div>
      <p class="small muted">Warm-up: K's Full Warmup, then pair CNS activation jumps with medball${day.mb?`: ${esc(day.mb)}`:""}.</p>
      ${exHtml}
    </div>
    <div class="savebar"><div><div class="small muted">Workout volume</div><div class="lb-vol num" id="volNow">0<small>lb</small></div></div>
      <div class="row" style="flex-wrap:nowrap;justify-content:flex-end"><span class="msg" id="saveMsg"></span><button class="primary" id="saveBtn">Save</button></div></div>
    <p class="small muted">Volume = weight × reps for every set. For "ea" lifts, log reps per side. Leave weight blank on bodyweight, timed, and sled work. Saved workouts count toward the week you log them.</p>`;
  const reset=()=>{S.liftKey=null;renderLift()};
  $("#selP").onchange=e=>{S.sel={p:e.target.value,w:0,d:0};reset()};
  $("#selW").onchange=e=>{S.sel.w=+e.target.value;reset()};
  $("#selD").onchange=e=>{S.sel.d=+e.target.value;reset()};
  $("#app").querySelectorAll(".sets input").forEach(inp=>inp.oninput=()=>{S.draft[inp.dataset.i][inp.dataset.j][inp.dataset.f]=inp.value.trim();updVol();setMsg("#saveMsg","")});
  updVol();
  $("#saveBtn").onclick=saveWorkout;
}
function draftVol(){let t=0;for(const i in S.draft)for(const s of S.draft[i])t+=numOr0(s.w)*numOr0(s.r);return t}
function updVol(){const el=$("#volNow");if(el)el.innerHTML=`${fmt(draftVol())}<small>lb</small>`}
async function saveWorkout(){
  const {p,w,d}=S.sel; const day=phaseById(p).days[d]; const em=entryMap();
  const payload=[];
  day.ex.forEach((ex,i)=>{
    const k=entryKey(p,w,d,i); const sets=S.draft[i].map(s=>[s.w,s.r]);
    if(sets.some(s=>s[0]!=="") || em[k]) payload.push({key:k,exercise:ex[0],sets});
  });
  if(!payload.length) return setMsg("#saveMsg","Enter a weight first.","err");
  const btn=$("#saveBtn"); btn.disabled=true; setMsg("#saveMsg","Saving…");
  try{
    const r=await rpc("save_entries",{p_id:S.auth.id,p_pin:S.auth.pin,p_entries:payload});
    if(!r.ok){ setMsg("#saveMsg",r.error,"err"); btn.disabled=false; return; }
    await reload();
    setMsg("#saveMsg","Saved","ok");
  }catch(e){ setMsg("#saveMsg",e.message,"err"); }
  if($("#saveBtn")) $("#saveBtn").disabled=false;
}

      </div>
      <div class="row"><button id="mSave">Save</button><span class="msg" id="mMsg"></span></div></div>
    <div class="grid2">
      <div class="card"><span class="small muted">This week</span><span class="big-num num">${fmt(weekVol(wk))}</span><span class="small muted">lb moved</span></div>
      <div class="card"><span class="small muted">Lifts attended</span><span class="big-num num">${myCheckins().length}</span><span class="small muted">this offseason</span></div>
    </div>
    <div class="card"><h3>Heaviest weight by lift</h3>
      ${prList.length?`<div>${prList.map(([n,v])=>`<div class="pr"><span>${esc(n)}</span><span class="num"><b>${fmt(v.w)}</b> lb${v.r?` × ${esc(v.r)}`:""}</span></div>`).join("")}</div>`:'<div class="empty">Log a workout and your heaviest sets show up here.</div>'}
    </div>
    <div class="row between"><button class="link" id="mOut">Sign out</button><a class="small" href="#coach">Coach screen</a></div>`;
  $("#mSave").onclick=async()=>{
    const name=$("#mName").value.trim();
    try{
      const r=await rpc("update_profile",{p_id:S.auth.id,p_pin:S.auth.pin,p_name:name,p_num:$("#mNum").value.trim()});
      if(!r.ok) return setMsg("#mMsg",r.error,"err");
      await reload(); setMsg("#mMsg","Saved","ok");
    }catch(e){ setMsg("#mMsg",e.message,"err"); }
  };
  $("#mOut").onclick=()=>{store.del("iwu-auth");S.auth=null;S.data=null;loginMode="in";route()};
}

// ===== Coach screen =====
let wakeLock=null;
async function keepAwake(){ try{ if(navigator.wakeLock && document.visibilityState==="visible") wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(location.hash==="#coach") keepAwake(); });

function renderCoachLogin(msg){
  $("#app").innerHTML=`<div class="card"><h2>Coach screen</h2>
    <p class="muted">Open check-in, show the code at the door, and see who's here.</p>
    <label for="cPass">Coach password<input id="cPass" type="password" autocomplete="current-password"></label>
    <button class="primary" id="cGo">Open coach screen</button><p class="msg err" id="cMsg">${esc(msg||"")}</p></div>
    <p class="small muted" style="text-align:center"><a href="#">Back to the player app</a></p>`;
  const go=async()=>{
    const pass=$("#cPass").value; if(!pass) return;
    $("#cGo").disabled=true;
    try{ const r=await rpc("coach_status",{p_pass:pass});
      if(!r.ok){ setMsg("#cMsg",r.error,"err"); $("#cGo").disabled=false; return; }
      S.coachPass=pass; store.set("iwu-coach",pass); renderCoach();
    }catch(e){ setMsg("#cMsg",e.message,"err"); $("#cGo").disabled=false; }
  };
  $("#cGo").onclick=go; $("#cPass").onkeydown=e=>{if(e.key==="Enter")go()};
}

function renderCoach(){
  if(!S.coachPass) return renderCoachLogin();
  S.coachSessKey=null; S.coachPlayersKey=null;
  $("#app").innerHTML=`<div class="coach-cols">
      <div style="display:flex;flex-direction:column;gap:14px"><div class="card" id="cSess"><p class="muted">Loading…</p></div></div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="card" id="cToday"></div>
        <div class="card" id="cWeek"><h3>This week's attendance</h3><div class="empty">Loading…</div></div>
        <div class="card" id="cManage"></div>
      </div></div>
    <div class="row between"><a class="small" href="#">Back to the player app</a><button class="link" id="cOut">Sign out of coach screen</button></div>`;
  $("#cOut").onclick=()=>{store.del("iwu-coach");S.coachPass=null;clearTimers();renderCoachLogin()};
  keepAwake();
  pollCoach(); every(4000,pollCoach);
  loadWeek(); every(30000,loadWeek);
  every(1000,tickCode);
}
async function pollCoach(){
  let r; try{ r=await rpc("coach_status",{p_pass:S.coachPass}); }catch(e){ return; }
  if(!r.ok){ store.del("iwu-coach"); S.coachPass=null; clearTimers(); return renderCoachLogin(r.error); }
  S.coach={...r,fetched:Date.now()};
  const s=r.session; const key=s?`${s.label}|${s.ends_at}`:"none";
  if(key!==S.coachSessKey){ S.coachSessKey=key; renderCoachSession(); }
  tickCode(); renderToday();
  const inCount=r.players.filter(p=>p.in_at).length;
  if(S.coachInCount!==undefined && inCount!==S.coachInCount) loadWeek();
  S.coachInCount=inCount;
  const pk=r.players.map(p=>p.id+p.name).join(",");
  if(pk!==S.coachPlayersKey){ S.coachPlayersKey=pk; renderManage(); }
}
function tickCode(){
  const s=S.coach?.session; const c=$("#code"); if(!s||!c) return;
  const elapsed=Math.floor((Date.now()-S.coach.fetched)/1000);
  const left=s.secs_left-elapsed;
  if(left<=0){ c.textContent="····"; pollCoach(); return; }
  c.textContent=s.code;
  $("#codeBar").style.width=(left/60*100)+"%";
  if(Date.now()>=new Date(s.ends_at).getTime()) pollCoach();
}
function renderCoachSession(){
  const el=$("#cSess"); if(!el) return; const s=S.coach.session;
  if(s){
    const url=location.href.split("#")[0];
    el.innerHTML=`<div class="row between"><span class="chip live">Check-in open</span><span class="small muted">closes ${timeOf(s.ends_at)}</span></div>
      <h2>${esc(s.label)}</h2>
      <div class="qr" id="qr"></div>
      <p class="small muted" style="text-align:center">Scan to open the app, sign in, then enter this code:</p>
      <div class="code num" id="code">${esc(s.code)}</div>
      <div class="bar"><i id="codeBar"></i></div>
      <p class="small muted" style="text-align:center">New code every minute. The previous minute's code still works.</p>
      <button class="danger" id="cEnd">Close check-in</button><p class="msg" id="cEndMsg"></p>`;
    try{ if(window.QRCode) new QRCode($("#qr"),{text:url,width:220,height:220,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
    $("#cEnd").onclick=async()=>{ $("#cEnd").disabled=true; try{ await rpc("coach_close",{p_pass:S.coachPass}); pollCoach(); }catch(e){ setMsg("#cEndMsg",e.message,"err"); $("#cEnd").disabled=false; } };
    return;
  }
  const loc=locate(new Date()); const ph=phaseById(loc.p);
  el.innerHTML=`<h2>Start a lift</h2>
    <label for="cDay">Workout<select id="cDay">${ph.days.map((x,i)=>`<option value="${i}">${esc(ph.name.split(" · ")[0])} W${loc.w+1} · ${esc(x.name)}</option>`).join("")}<option value="x">Active recovery / other</option></select></label>
    <label for="cLen">Check-in stays open for<select id="cLen"><option value="30">30 minutes</option><option value="60" selected>60 minutes</option><option value="90">90 minutes</option><option value="120">2 hours</option></select></label>
    <button class="primary" id="cStart">Open check-in</button><p class="msg" id="cMsg"></p>`;
  $("#cStart").onclick=async()=>{
    const v=$("#cDay").value, len=+$("#cLen").value;
    const label=v==="x"?"Active recovery":`${ph.name.split(" · ")[0]} W${loc.w+1} · ${ph.days[+v].name}`;
    $("#cStart").disabled=true;
    try{
      const r=await rpc("coach_open",{p_pass:S.coachPass,p_label:label,p_phase:loc.p,p_week:loc.w,p_day:v==="x"?0:+v,p_minutes:len});
      if(!r.ok){ setMsg("#cMsg",r.error,"err"); $("#cStart").disabled=false; return; }
      pollCoach();
    }catch(e){ setMsg("#cMsg",e.message,"err"); $("#cStart").disabled=false; }
  };
}
function renderToday(){
  const el=$("#cToday"); if(!el) return; const ps=S.coach.players;
  const inP=ps.filter(p=>p.in_at).sort((a,b)=>a.in_at<b.in_at?-1:1), out=ps.filter(p=>!p.in_at);
  const row=(p,t)=>`<div class="att-row"><span>${t?"<b>":""}${esc(p.name)}${t?"</b>":""}${p.num?` <span class="muted">#${esc(p.num)}</span>`:""}</span><span class="small muted num">${t?timeOf(p.in_at):"—"}</span></div>`;
  el.innerHTML=`<div class="row between"><h3>Today · ${shortDate(parseISO(S.coach.today))}</h3><span class="chip ok">${inP.length} / ${ps.length} in</span></div>
    <div>${inP.map(p=>row(p,true)).join("")||'<div class="empty">Nobody has checked in yet today.</div>'}</div>
    ${out.length?`<h3>Not checked in</h3><div>${out.map(p=>row(p,false)).join("")}</div>`:""}`;
}
async function loadWeek(){
  let r; try{ r=await rpc("coach_week",{p_pass:S.coachPass,p_week:S.coach?.week||iso(new Date())}); }catch(e){ return; }
  const el=$("#cWeek"); if(!el||!r.ok) return;
  const start=parseISO(r.week); const days=[...Array(7)].map((_,i)=>iso(addDays(start,i)));
  const dn=["M","T","W","T","F","S","S"];
  el.innerHTML=`<h3>Week of ${shortDate(start)}</h3>
    ${r.rows.length?`<div class="tbl-wrap"><table class="wk"><thead><tr><th>Player</th>${dn.map(d=>`<th>${d}</th>`).join("")}<th>Total</th></tr></thead><tbody>
    ${r.rows.map(p=>`<tr><td>${esc(p.name)}</td>${days.map(d=>`<td class="${p.days.includes(d)?"y":"muted"}">${p.days.includes(d)?"✓":"·"}</td>`).join("")}<td class="tot num">${p.days.length}</td></tr>`).join("")}
    </tbody></table></div>`:'<div class="empty">No players yet.</div>'}`;
}
function renderManage(){
  const el=$("#cManage"); if(!el) return; const ps=S.coach.players;
  el.innerHTML=`<h3>Manage players</h3>
    <label for="mpWho">Player<select id="mpWho"><option value="">Choose a player</option>${ps.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}${p.num?` #${esc(p.num)}`:""}</option>`).join("")}</select></label>
    <div class="grid2" style="align-items:end">
      <label for="mpPin">New 4-digit PIN<input id="mpPin" inputmode="numeric" maxlength="4"></label>
      <button id="mpReset">Reset PIN</button>
    </div>
    <div class="row between"><button class="danger" id="mpDel">Remove player</button><span class="msg" id="mpMsg"></span></div>
    <p class="small muted">Removing a player deletes their check-ins and logged lifts.</p>`;
  const who=()=>$("#mpWho").value;
  $("#mpReset").onclick=async()=>{
    if(!who()) return setMsg("#mpMsg","Choose a player.","err");
    try{ const r=await rpc("coach_reset_pin",{p_pass:S.coachPass,p_player:who(),p_pin:$("#mpPin").value.trim()});
      setMsg("#mpMsg",r.ok?"PIN reset. Tell the player their new PIN.":r.error,r.ok?"ok":"err"); if(r.ok)$("#mpPin").value=""; }
    catch(e){ setMsg("#mpMsg",e.message,"err"); }
  };
  $("#mpDel").onclick=async()=>{
    if(!who()) return setMsg("#mpMsg","Choose a player.","err");
    const name=$("#mpWho").selectedOptions[0].textContent;
    if(!window.confirm(`Remove ${name} and all of their data?`)) return;
    try{ const r=await rpc("coach_remove_player",{p_pass:S.coachPass,p_player:who()});
      if(!r.ok) return setMsg("#mpMsg",r.error,"err"); pollCoach(); loadWeek(); }
    catch(e){ setMsg("#mpMsg",e.message,"err"); }
  };
}
</script>
</body>
</html>
